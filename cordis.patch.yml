# dsh-always-allow bundle patch: mount the host half that appends allow rules
# to the workspace rule file. The browser half is mounted by the Loader from the
# `dsh.client` field in package.json.
#
# `dsh-permission-rules` must already be installed and enabled in the same
# profile: this plugin only WRITES its rule file and never re-evaluates rules,
# so a saved rule has no effect without that row.
#
# A patch row replaces the WHOLE config of a row it targets, so a profile that
# wants different values restates every key it keeps.
- insert:
    - id: always-allow
      name: dsh-always-allow
      config:
        # Rule file, resolved against the session cwd unless absolute. Must
        # equal the `rulesFile` of the installed dsh-permission-rules row
        # (that bundle's own patch defaults to this value).
        rulesFile: .dsh/rules.yaml
        # Shell Tool names whose arguments carry the command line. Only tools
        # with a `command` string argument are supported.
        toolNames:
          - bash
          - pwsh
        # How many pending approvals are remembered for the browser half.
        maxTracked: 128
